name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python3 -m unittest discover -v
      - name: Install Ruff
        run: pip install ruff
      - name: Detect changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" HEAD -- '*.py' > "$RUNNER_TEMP/changed-python"
          else
            # New branches and unavailable push bases must not silently skip lint.
            git ls-files -z -- '*.py' > "$RUNNER_TEMP/changed-python"
          fi
      - name: Lint changed Python
        run: |
          mapfile -d '' -t files < "$RUNNER_TEMP/changed-python"
          if ((${#files[@]})); then
            ruff check -- "${files[@]}"
          fi
      - name: Check formatting of changed Python
        run: |
          mapfile -d '' -t files < "$RUNNER_TEMP/changed-python"
          if ((${#files[@]})); then
            ruff format --check -- "${files[@]}"
          fi

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install jsdom
        run: npm install --no-audit --no-fund
      - name: Run browser tests
        run: npm test
